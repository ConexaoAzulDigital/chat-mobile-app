name: Android Build (Native — sem EAS)

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      EXPO_PUBLIC_APP_SLUG: magica-chat
      EXPO_PUBLIC_PROJECT_ID: 2a9ff588-2989-4260-b49a-0ddc8c493ab1
      EXPO_PUBLIC_ANDROID_GOOGLE_SERVICES_FILE: ./google-services.json
      EXPO_PUBLIC_CHATWOOT_BASE_URL: https://chat.conexaoazul.com
      EXPO_NO_FIREBASE: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine build type
        id: build-type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ inputs.build_type }}" >> $GITHUB_OUTPUT
          else
            echo "type=debug" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > google-services.json

      - name: Expo Prebuild (Android)
        run: pnpm exec expo prebuild --clean --platform android --no-install
        env:
          EXPO_NO_GIT_STATUS: "1"

      # ── DEBUG BUILD ────────────────────────────────────────────────────────
      - name: Build Debug APK
        if: steps.build-type.outputs.type == 'debug'
        run: cd android && ./gradlew assembleDebug --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Upload Debug APK
        if: steps.build-type.outputs.type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: magica-chat-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # ── RELEASE BUILD ──────────────────────────────────────────────────────
      - name: Setup Release Keystore
        if: steps.build-type.outputs.type == 'release'
        run: |
          if [ -n "$KS" ]; then
            echo "Usando keystore dos secrets..."
            echo "$KS" | base64 -d > android/app/release.keystore
          fi
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build Release APK
        if: steps.build-type.outputs.type == 'release'
        run: cd android && ./gradlew assembleRelease --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m"
          SENTRY_DISABLE_AUTO_UPLOAD: true

      - name: Upload Release APK
        if: steps.build-type.outputs.type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: magica-chat-release-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
